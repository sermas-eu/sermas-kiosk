# The kiosk as a container, on :3001. Started by sermas-dev's `task docker:start`.
#
# Host networking, so that the kiosk's server side reaches the same URLs as the
# browser: PUBLIC_AUTH_URL is http://localhost:8080/keycloak, and localhost inside a
# bridged container is not the host.

services:
  kiosk:
    build:
      context: .
      additional_contexts:
        toolkit: ${TOOLKIT_DIR:-../sermas-toolkit-web}
        api-client: ${API_CLIENT_DIR:-../sermas-api-client}
    image: sermas-kiosk:local
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: ${SERMAS_DEV_ROOT:-.}/config/kiosk/.env
        required: false
    environment:
      PORT: "3001"
      HOST: 0.0.0.0
